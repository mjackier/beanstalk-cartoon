<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beanstalk Storybook</title>
  <meta name="description" content="A 20-page picture book starring your child: Jack and the Beanstalk or Little Red Riding Hood." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- fonts load without blocking the first paint -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="app.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30C16 18 10 14 6 12c6 0 9 3 10 6 1-6 5-12 12-14-5 4-8 10-8 18v8z' fill='%231f4d3a'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 30C16 18 10 14 6 12c6 0 9 3 10 6 1-6 5-12 12-14-5 4-8 10-8 18v8z" /></svg>
      Beanstalk Storybook
    </a>
    <nav id="nav" hidden>
      <a href="#/" data-nav="books">My books</a>
      <a href="#/account" data-nav="account">Account <span class="chip" id="balanceChip">$0.00</span></a>
      <a href="#/admin" data-nav="admin" id="adminLink" hidden>Scenes</a>
      <button class="avatar" id="avatarBtn" aria-haspopup="true" aria-expanded="false"><img id="avatarImg" alt="" /></button>
      <div class="menu" id="userMenu" hidden>
        <p id="userEmail"></p>
        <a href="/auth/logout?next=/">Sign out</a>
      </div>
    </nav>
  </header>

  <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>

  <dialog id="pwDialog">
    <form method="dialog" id="pwForm">
      <h2>Password for drawing</h2>
      <p>Drawing pictures spends real money on the image service, so it needs the class password.</p>
      <input id="pwInput" type="password" autocomplete="current-password" required aria-label="Password" />
      <p class="error" id="pwError"></p>
      <div class="row end">
        <button type="button" class="ghost" id="pwCancel">Cancel</button>
        <button class="primary">Continue</button>
      </div>
    </form>
  </dialog>

  <footer class="foot">
    <a href="/privacy.html">Privacy</a>
    <span>Payments run in Stripe test mode: no real money moves.</span>
  </footer>

  <script src="app.js?v=3" type="module"></script>
</body>
</html>
